<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isuper agent - SDK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      /* ใช้ฟอนต์ระบบไอโฟน/อุปกรณ์แอปเปิ้ลเป็นหลัก */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 60px;
      align-self: flex-start;
      width: 100%;
      text-align: left;
    }
    .logo-container {
      width: 140px;
      height: 140px;
      margin-bottom: 45px;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.25));
    }
    .en-text {
      font-size: 28px;
      line-height: 1.5;
      color: #fff;
      margin-bottom: 40px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .th-description {
      font-size: 16px;
      line-height: 1.8;
      color: #e0e0e0;
      margin-bottom: 45px;
      max-width: 480px;
    }
    .buttons-wrapper {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn-primary {
      background-color: #fff;
      color: #000;
      font-weight: 500;
    }
    .btn-primary:hover {
      background-color: #f0f0f0;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: #1c1c1e;
      color: #fff;
      border: 1px solid #38383a;
    }
    .btn-secondary:hover {
      background-color: #2c2c2e;
    }
  </style>
</head>
<body>
  <h1 class="page-title">Isuper agent - SDK</h1>

  <!-- ไอคอน SVG ตรงกับรูปทรงในภาพเป๊ะ -->
  <div class="logo-container">
    <svg width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" rx="36" fill="#000"/>
      <!-- ด้านซ้าย -->
      <path fill="#fff" d="M58 40 L98 28 L98 78 L58 98 L38 88 L38 50 Z M58 160 L98 140 L98 102 L58 122 L38 112 L38 150 Z"/>
      <!-- ด้านขวา -->
      <path fill="#fff" d="M102 28 L142 40 L162 50 L162 88 L142 98 L102 78 Z M102 172 L102 122 L142 102 L162 112 L162 150 L142 160 Z"/>
      <!-- ช่องว่างตรงกลาง -->
      <path fill="#000" d="M98 55 L102 55 L102 145 L98 145 Z"/>
      <!-- เส้นขอบรูปทรงรวม -->
      <path fill="none" stroke="#fff" stroke-width="10" d="M58 40 L100 25 L142 40 L162 50 L162 150 L142 160 L100 175 L58 160 L38 150 L38 50 Z"/>
    </svg>
  </div>

  <!-- ข้อความภาษาอังกฤษตรงกลาง ปรับเรียบร้อยแล้ว -->
  <p class="en-text">
    Building a system<br>
    using just a single<br>
    mobile phone
  </p>

  <p class="th-description">
    ผู้สร้าง คือ ผู้ใช้จริง ที่พบปัญหาทะเลาะกับ AI<br>
    แบบ Loop และรวมแนวทางวิธีแก้ไว้ที่นี่
  </p>

  <div class="buttons-wrapper">
    <button class="btn btn-primary" onclick="location.href='/login'">เริ่มใช้งานทันที</button>
    <button class="btn btn-secondary">ติดต่อฝ่ายขาย</button>
  </div>
</body>
</html>
