<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <title>Isuper agent - sdk · Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #2a2a2a;
      --border-hover: #3a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #3b82f6;
      --btn-white: #f5f5f5;
      --btn-white-text: #0a0a0a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .login {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #141414;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .logo-wrap svg {
      width: 44px;
      height: 44px;
    }

    /* Brand title */
    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
      text-align: center;
    }

    .brand .sdk {
      color: var(--accent);
      font-weight: 600;
    }

    /* Form */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .field input:focus {
      border-color: #4a4a4a;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius);
      background: var(--btn-white);
      color: var(--btn-white-text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: #e8e8e8;
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 16px 0 12px;
    }

    /* Provider buttons */
    .providers {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-provider {
      position: relative;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
    }

    .btn-provider:hover {
      background: #111111;
      border-color: var(--border-hover);
    }

    .btn-provider:active {
      transform: scale(0.985);
    }

    .btn-provider .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .btn-provider .icon svg {
      width: 18px;
      height: 18px;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 0 0 2px var(--bg);
    }

    /* Footer links */
    .more-options {
      margin-top: 20px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px;
    }

    .more-options:hover {
      color: var(--text-muted);
    }

    .signup {
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    .signup a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    [hidden] { display: none !important; }

    #sign-in {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-msg {
      width: 100%;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    .auth-msg.error { color: #f87171; }

    .signed-in {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .signed-in img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
    }

    .signed-in .who { font-size: 0.95rem; color: var(--text-muted); }
    .signed-in .who strong { color: var(--text); }

    /* Subtle focus ring for keyboard */
    .btn-primary:focus-visible,
    .btn-provider:focus-visible,
    .more-options:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="login">
    <!-- Logo -->
    <div class="logo-wrap" aria-hidden="true">
      <!-- โลโก้ Isuper agent - SDK: tile มาจาก .logo-wrap, ข้างในใช้เฉพาะรูปทรงสีขาวจาก logo.svg -->
      <svg viewBox="30 20 144 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFFFFF" fill-rule="evenodd" d="
    M104,30 L162,66 L163,133 L103,169 L103,139 L131,120 L103,101 Z
    M97,30  L41,66  L41,93  L94,63 Z
    M88,76 L41,102 L41,133 L94,168 L94,138 L63,119 L67,111 L93,96 L93,79 Z
    M126,72 L144,84 L143,108 L124,92 Z
  "/>
      </svg>
    </div>

    <h1 class="brand">Isuper agent - <span class="sdk">sdk</span></h1>

    <p id="auth-msg" class="auth-msg" role="status" hidden></p>

    <div id="signed-in" class="signed-in" hidden>
      <img id="user-avatar" alt="" hidden />
      <p class="who">Signed in as <strong id="user-name"></strong></p>
      <button type="button" class="btn-primary" onclick="location.href='/'">Go to home</button>
      <button type="button" class="more-options" onclick="logout()">Sign out</button>
    </div>

    <div id="sign-in">
    <form id="login-form" onsubmit="return handleEmail(event)">
      <div class="field">
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email Address"
          autocomplete="email"
          required
        />
      </div>
      <button type="submit" class="btn-primary">Continue with Email</button>
    </form>

    <div class="divider" role="separator"></div>

    <div class="providers">
      <!-- GitHub -->
      <button type="button" class="btn-provider" onclick="provider('github')">
        <span class="badge">Last Used</span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58 0-.28-.01-1.02-.02-2-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.66-.3-5.46-1.33-5.46-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.4s2.04.13 3 .4c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.89-.01 3.29 0 .32.22.7.83.58C20.56 21.8 24 17.3 24 12 24 5.37 18.63 0 12 0z"/>
          </svg>
        </span>
        Continue with GitHub
      </button>

      <!-- Google -->
      <button type="button" class="btn-provider" onclick="provider('google')">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-.9 2.2-1.9 2.9l3.1 2.4c1.8-1.7 2.9-4.1 2.9-7 0-.7-.1-1.3-.2-1.9H12z"/>
            <path fill="#34A853" d="M5.3 14.3l-.8.6-2.4 1.9C3.8 20.2 7.6 23 12 23c2.7 0 5-.9 6.7-2.4l-3.1-2.4c-.9.6-2 1-3.6 1-2.8 0-5.1-1.9-6-4.4z"/>
            <path fill="#FBBC05" d="M3.1 7.1C2.4 8.5 2 10.2 2 12s.4 3.5 1.1 4.9l3.2-2.5c-.2-.6-.3-1.2-.3-1.9 0-.7.1-1.4.3-2L3.1 7.1z"/>
            <path fill="#4285F4" d="M12 4.8c1.5 0 2.8.5 3.9 1.5l2.9-2.9C16.9 1.7 14.7.8 12 .8 7.6.8 3.8 3.6 2.1 7.1l3.2 2.5C6.9 6.7 9.2 4.8 12 4.8z"/>
          </svg>
        </span>
        Continue with Google
      </button>

      <!-- ChatGPT -->
      <button type="button" class="btn-provider" onclick="provider('chatgpt')">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.76a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.496zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.761a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.814 3.354-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.787a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zM8.257 12.983l-2.02-1.163a.08.08 0 0 1-.038-.057V6.178a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.568a.792.792 0 0 0-.392.681zm1.047-1.682l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>
          </svg>
        </span>
        Continue with ChatGPT
      </button>

      <!-- SAML SSO -->
      <button type="button" class="btn-provider" onclick="provider('saml')">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        Continue with SAML SSO
      </button>

      <!-- Passkey -->
      <button type="button" class="btn-provider" onclick="provider('passkey')">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </span>
        Continue with Passkey
      </button>
    </div>

    <button type="button" class="more-options" onclick="showMore()">Show other options</button>

    <p class="signup">
      Don't have an account?
      <a href="#" onclick="signup(event)">Sign Up</a>
    </p>
    </div>
  </main>

  <script>
    const ERRORS = {
      not_configured: 'This sign-in method is not set up on the server yet.',
      cancelled: 'Sign-in was cancelled.',
      bad_state: 'Sign-in expired or was started in another tab. Please try again.',
      link_expired: 'That sign-in link is invalid or has expired. Request a new one.',
      failed: 'Sign-in failed. Please try again.',
    };
    let available = {};

    function say(text, isError) {
      const el = document.getElementById('auth-msg');
      el.textContent = text;
      el.className = 'auth-msg' + (isError ? ' error' : '');
      el.hidden = !text;
    }

    async function handleEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return false;
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      say('Sending sign-in link…');
      try {
        const res = await fetch('/api/auth/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) say('Check ' + email + ' for a sign-in link. It expires in 15 minutes.');
        else if (data.error === 'invalid_email') say('Please enter a valid email address.', true);
        else if (data.error === 'not_configured') say('Email sign-in is not set up yet. Use GitHub or Google.', true);
        else say('Could not send the email. Please try again.', true);
      } catch {
        say('Network error. Please try again.', true);
      } finally {
        btn.disabled = false;
      }
      return false;
    }

    function provider(name) {
      if (name === 'github' || name === 'google') {
        if (available[name] === false) return say(ERRORS.not_configured, true);
        location.href = '/api/auth/login/' + name;
        return;
      }
      const label = { chatgpt: 'ChatGPT', saml: 'SAML SSO', passkey: 'Passkey' }[name] || name;
      say(label + ' sign-in is not available yet. Use GitHub, Google or email.', true);
    }

    function showMore() {
      say('No other sign-in options yet.');
    }

    function signup(e) {
      e.preventDefault();
      say('No separate sign-up: your account is created the first time you sign in.');
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
      location.replace('/login');
    }

    (async function init() {
      const params = new URLSearchParams(location.search);
      const err = params.get('error');
      if (err) say(ERRORS[err] || ERRORS.failed, true);
      if (params.has('error') || params.has('signed_in')) history.replaceState(null, '', '/login');

      try {
        const me = await fetch('/api/auth/me').then((r) => r.json());
        if (me.user) {
          document.getElementById('sign-in').hidden = true;
          document.getElementById('user-name').textContent = me.user.name || me.user.email || 'you';
          if (me.user.avatar) {
            const img = document.getElementById('user-avatar');
            img.src = me.user.avatar;
            img.hidden = false;
          }
          document.getElementById('signed-in').hidden = false;
          return;
        }
      } catch {}
      try {
        available = await fetch('/api/auth/providers').then((r) => r.json());
      } catch {}
    })();
  </script>
</body>
</html>
